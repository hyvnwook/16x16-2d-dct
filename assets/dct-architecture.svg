<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1200" height="250" rx="14" fill="#f4f7fb"/><text x="32" y="42" font-size="23" font-weight="700" fill="#132b42">DCT / two separable transforms, two single-buffer transposes</text><rect x="26" y="80" width="168" height="94" rx="10" fill="#fff" stroke="#bacbdc"/><text x="110.0" y="117" text-anchor="middle" fill="#193c56" font-size="19" font-weight="700">MEM_IN</text><text x="110.0" y="146" text-anchor="middle" fill="#50677c" font-size="15">16 pixels / word</text><path d="M198 127h18l-5 -5m5 5l-5 5" fill="none" stroke="#239c8b" stroke-width="2"/><rect x="222" y="80" width="168" height="94" rx="10" fill="#fff" stroke="#bacbdc"/><text x="306.0" y="117" text-anchor="middle" fill="#193c56" font-size="19" font-weight="700">DCT_ROW</text><text x="306.0" y="146" text-anchor="middle" fill="#50677c" font-size="15">shift-add + scale</text><path d="M394 127h18l-5 -5m5 5l-5 5" fill="none" stroke="#239c8b" stroke-width="2"/><rect x="418" y="80" width="168" height="94" rx="10" fill="#fff" stroke="#bacbdc"/><text x="502.0" y="117" text-anchor="middle" fill="#193c56" font-size="19" font-weight="700">TP_IN</text><text x="502.0" y="146" text-anchor="middle" fill="#50677c" font-size="15">16 x 16 / 11-bit</text><path d="M590 127h18l-5 -5m5 5l-5 5" fill="none" stroke="#239c8b" stroke-width="2"/><rect x="614" y="80" width="168" height="94" rx="10" fill="#fff" stroke="#bacbdc"/><text x="698.0" y="117" text-anchor="middle" fill="#193c56" font-size="19" font-weight="700">DCT_COL</text><text x="698.0" y="146" text-anchor="middle" fill="#50677c" font-size="15">scale + saturation</text><path d="M786 127h18l-5 -5m5 5l-5 5" fill="none" stroke="#239c8b" stroke-width="2"/><rect x="810" y="80" width="168" height="94" rx="10" fill="#fff" stroke="#bacbdc"/><text x="894.0" y="117" text-anchor="middle" fill="#193c56" font-size="19" font-weight="700">TP_OUT</text><text x="894.0" y="146" text-anchor="middle" fill="#50677c" font-size="15">11 x 11 / 11-bit</text><path d="M982 127h18l-5 -5m5 5l-5 5" fill="none" stroke="#239c8b" stroke-width="2"/><rect x="1006" y="80" width="168" height="94" rx="10" fill="#fff" stroke="#bacbdc"/><text x="1090.0" y="117" text-anchor="middle" fill="#193c56" font-size="19" font-weight="700">MEM_OUT</text><text x="1090.0" y="146" text-anchor="middle" fill="#50677c" font-size="15">16 coefficients</text><text x="32" y="216" fill="#50677c" font-size="16">Continuous 16-cycle block schedule  |  Output frequencies 11-15 are zero-filled</text></svg>
